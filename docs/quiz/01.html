<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1강 순열 퀴즈</title>
<link rel="stylesheet" href="../site.css">
<style>
.page{max-width:720px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.top a{color:var(--mute);text-decoration:none;font-size:15px}
.prog{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin:14px 0 22px}
.prog div{height:100%;background:var(--acc);transition:width .3s}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--acc-soft);color:var(--acc)}
.q{font-size:21px;font-weight:700;margin:12px 0 18px;line-height:1.5}
.opts{display:grid;gap:10px}
.opt{font:inherit;font-size:18px;text-align:left;padding:13px 16px;border-radius:12px;border:2px solid var(--line);
  background:var(--card);color:var(--ink);cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt:disabled{cursor:default}
.numrow{display:flex;gap:10px;flex-wrap:wrap}
.numrow input{font:inherit;font-size:20px;width:180px;padding:10px 14px;border-radius:12px;border:2px solid var(--line);
  background:var(--card);color:var(--ink)}
.fb{margin-top:18px;border-radius:12px;padding:14px 18px;font-size:17px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--green-soft);border-left:6px solid var(--green)}
.fb.no{background:var(--red-soft);border-left:6px solid var(--red)}
.fb b{display:block;margin-bottom:4px}
.nav{margin-top:18px;display:flex;justify-content:flex-end;gap:10px}
.score{font-size:56px;font-weight:800;color:var(--acc);margin:6px 0}
.res li{margin:6px 0}
.res .x{color:var(--red);font-weight:700}
.res .o{color:var(--green);font-weight:700}
</style>
</head>
<body>
<div class="page">
  <div class="top"><a href="../">← 강의 홈</a><a href="../lectures/01/">1강 슬라이드 보기</a></div>
  <div class="kicker">1강 여러 가지 순열</div>
  <h1>간단 퀴즈</h1>
  <div class="prog"><div id="bar" style="width:0"></div></div>
  <div class="card" id="box"></div>
</div>

<script>
const QUIZ = [
  { tag: "원순열", q: "할머니와 할아버지를 포함한 가족 6명이 원형 식탁에 둘러앉는 방법의 수는?", type: "num", ans: 120,
    why: "한 명을 고정하고 나머지 5명을 줄 세운다: (6−1)! = 5! = 120" },
  { tag: "원순열", q: "회장·부회장을 포함한 5명이 원탁에 앉을 때, 회장과 부회장이 이웃하게 앉는 방법의 수는?", type: "num", ans: 12,
    why: "두 사람을 끈으로 묶어 한 사람으로 보면 4명의 원순열 (4−1)! = 6. 묶음 안에서 자리 바꾸기 2! = 2. 6 × 2 = 12" },
  { tag: "중복순열", q: "₄Π₃의 값은?", type: "mc", opts: ["12", "24", "64", "81"], ans: 2,
    why: "₄Π₃ = 4 × 4 × 4 = 4³ = 64. (순열 ₄P₃ = 24와 헷갈리지 않기)" },
  { tag: "중복순열", q: "학생 5명이 농구·야구·축구 동아리 중 하나씩 고르는 방법의 수는?", type: "mc", opts: ["5³ = 125", "3⁵ = 243", "₅C₃ = 10", "₅P₃ = 60"], ans: 1,
    why: "고르는 쪽(학생 5명)이 지수, 골라지는 쪽(동아리 3개)이 밑: 3⁵ = 243" },
  { tag: "중복순열", q: "0, 1, 2에서 중복을 허용하여 만들 수 있는 세 자리 자연수의 개수는?", type: "num", ans: 18,
    why: "백의 자리에는 0이 올 수 없으니 2가지, 나머지 두 자리는 3가지씩: 2 × 3 × 3 = 18" },
  { tag: "같은 것이 있는 순열", q: "BANANA의 6개 문자를 일렬로 나열하는 방법의 수는?", type: "num", ans: 60,
    why: "a 3개, n 2개, b 1개: 6! ÷ (3! × 2!) = 720 ÷ 12 = 60" },
  { tag: "같은 것이 있는 순열", q: "1, 1, 2, 2, 2를 모두 사용하여 만들 수 있는 다섯 자리 자연수의 개수는?", type: "mc", opts: ["10", "20", "30", "120"], ans: 0,
    why: "5! ÷ (2! × 3!) = 120 ÷ 12 = 10" },
  { tag: "최단 경로", q: "가로 3칸, 세로 3칸인 바둑판 길에서 왼쪽 아래 A에서 오른쪽 위 B까지 최단 거리로 가는 방법의 수는?", type: "num", ans: 20,
    why: "어느 길이든 → 3번, ↑ 3번. 화살표 6개를 나열하는 방법: 6! ÷ (3! × 3!) = 20" },
  { tag: "개념", q: "다음 중 ‘중복순열’로 세는 것은?", type: "mc",
    opts: ["5명이 원탁에 둘러앉는 방법", "0~9로 네 자리 비밀번호를 만드는 방법", "APPLE의 문자를 나열하는 방법", "5명 중 대표 2명을 뽑는 방법"], ans: 1,
    why: "비밀번호는 같은 숫자를 다시 써도 되고 순서가 중요하다 → ₁₀Π₄ = 10⁴. 나머지는 차례로 원순열, 같은 것이 있는 순열, 조합" },
  { tag: "수학 이야기", q: "서로 구별되는 주사위 3개를 던질 때, 눈의 합이 10이 되는 경우의 수는?", type: "mc", opts: ["6", "25", "27", "216"], ans: 2,
    why: "(1,3,6)(1,4,5)(2,3,5)는 3! = 6씩, (2,2,6)(2,4,4)(3,3,4)는 3!/2! = 3씩: 18 + 9 = 27. 합 9는 25라서 10이 조금 더 자주 나온다 (갈릴레이)" },
];

const box = document.getElementById("box"), bar = document.getElementById("bar");
let order = [], pos = 0, results = {};

function start(list) {
  order = list; pos = 0;
  list.forEach(i => delete results[i]);
  show();
}
function show() {
  bar.style.width = (pos / order.length * 100) + "%";
  if (pos >= order.length) return finish();
  const i = order[pos], it = QUIZ[i];
  box.innerHTML = `
    <span class="tag">${it.tag}</span> <span style="color:var(--mute);font-size:14px">${pos + 1} / ${order.length}</span>
    <div class="q">${it.q}</div>
    ${it.type === "mc"
      ? `<div class="opts">${it.opts.map((o, k) => `<button class="opt" data-k="${k}">${"①②③④"[k]} ${o}</button>`).join("")}</div>`
      : `<form class="numrow"><input type="number" inputmode="numeric" placeholder="답 입력" required aria-label="답"><button class="btn">확인</button></form>`}
    <div class="fb" id="fb"></div>
    <div class="nav"><button class="btn" id="next" style="display:none">${pos + 1 < order.length ? "다음 문제 →" : "결과 보기"}</button></div>`;
  if (it.type === "mc") {
    box.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      const k = +b.dataset.k;
      box.querySelectorAll(".opt").forEach(x => { x.disabled = true; if (+x.dataset.k === it.ans) x.classList.add("right"); });
      if (k !== it.ans) b.classList.add("wrong");
      judge(i, k === it.ans);
    });
  } else {
    const f = box.querySelector("form"), inp = f.querySelector("input");
    inp.focus();
    f.onsubmit = e => {
      e.preventDefault();
      inp.disabled = true; f.querySelector("button").disabled = true;
      judge(i, +inp.value === it.ans);
    };
  }
}
function judge(i, ok) {
  results[i] = ok;
  const it = QUIZ[i], fb = document.getElementById("fb");
  fb.className = "fb show " + (ok ? "ok" : "no");
  fb.innerHTML = `<b>${ok ? "정답!" : "아쉬워요. 정답은 " + (it.type === "mc" ? "①②③④"[it.ans] + " " + it.opts[it.ans] : it.ans)}</b>${it.why}`;
  const nx = document.getElementById("next");
  nx.style.display = "";
  nx.onclick = () => { pos++; show(); };
  nx.focus();
}
function finish() {
  const all = QUIZ.map((_, i) => i), right = all.filter(i => results[i]).length;
  const wrong = all.filter(i => results[i] === false);
  box.innerHTML = `
    <div style="text-align:center">
      <div class="kicker">결과</div>
      <div class="score">${right} / ${QUIZ.length}</div>
      <p style="color:var(--mute)">${right === QUIZ.length ? "모두 맞혔어요! 1강 내용을 잘 이해했습니다." : right >= 7 ? "잘했어요. 틀린 문제만 다시 풀어 볼까요?" : "슬라이드를 한 번 더 보고 다시 도전해 보세요."}</p>
    </div>
    <ul class="res">${all.map(i => `<li><span class="${results[i] ? "o" : "x"}">${results[i] ? "○" : "✕"}</span> ${QUIZ[i].q}</li>`).join("")}</ul>
    <div class="nav">
      ${wrong.length ? `<button class="btn" id="again">틀린 문제 다시 (${wrong.length})</button>` : ""}
      <button class="btn ghost" id="restart">처음부터</button>
    </div>`;
  bar.style.width = "100%";
  if (wrong.length) document.getElementById("again").onclick = () => start(wrong);
  document.getElementById("restart").onclick = () => start(QUIZ.map((_, i) => i));
}
start(QUIZ.map((_, i) => i));
</script>
</body>
</html>
